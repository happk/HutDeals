name: Daily coupon update

on:
  # scan 成功後 repository_dispatch(scan-complete) 觸發；也可手動 workflow_dispatch
  repository_dispatch:
    types: [scan-complete]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-coupons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # orderflow session 流程（enrich_official 抽選單版 JS 變數）需要 node
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 抓取 + 解析 + 合併 + 輸出 public/coupons.js(stdlib 零依賴,無需 pipenv)
      - name: Build coupon data
        run: python -m script.site.build_coupons

      # 併入掃號驗證的外部碼(source=verified-external,聯名/季節),資料在 scan_state.json
      - name: Ingest external codes
        run: python -m script.site.ingest_external

      # 官方碼 step_2 補全(通路/原價/cno直連/items),只補缺不覆蓋
      - name: Enrich official coupons
        run: python -m script.site.enrich_official

      # sitemap:讀當日 coupons.js 活躍券重產（順序須在 ingest/enrich 之後）
      - name: Generate sitemap
        run: python -m script.site.gen_sitemap

      # enrich 的 step2 失敗併入 alerts；同步到 public 供 admin 顯示
      - name: Publish alerts to public
        run: |
          if [ -f data/scan_alerts.json ]; then
            cp data/scan_alerts.json public/scan_alerts.json
          fi

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- public/coupons.js public/coupons_full.js public/sitemap.xml data/scan_alerts.json public/scan_alerts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no coupon changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/coupons.js public/coupons_full.js public/sitemap.xml data/scan_alerts.json public/scan_alerts.json
            git commit -m "daily update coupon information ($(date -u +%F))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 爬蟲失敗告警:開 Issue(已有開啟中的告警票則不重複開)
      - name: Create failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh label create 建不出「不存在」的 label → 不存在(GET 404)才用 REST 建立
          gh api "repos/$GITHUB_REPOSITORY/labels/scrape-failed" >/dev/null 2>&1 \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/labels" \
                 -f name=scrape-failed -f color=ff0000 \
                 -f "description=每日爬蟲失敗(官網改版)" >/dev/null
          TITLE="每日爬蟲失敗 $(date -u +%F)"
          COUNT=$(gh issue list --label scrape-failed --state open --json number --jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            gh issue create \
              --title "$TITLE" \
              --label "scrape-failed" \
              --body "script.site.build_coupons 執行失敗(可能是官網改版)。舊的 public/coupons.js 未被覆蓋,網站仍顯示前一日資料。請查看 Actions log。"
          else
            echo "open scrape-failed issue already exists, skip"
          fi

      # update 成功 → 觸發 deploy(鏈式)
      - name: Dispatch deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=update-complete -f "client_payload[from]=update"
          echo "update 成功，已 dispatch update-complete"
